name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip customtkinter pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TrimUICompanion --collect-all customtkinter trimui_companion.py
      - uses: actions/upload-artifact@v4
        with:
          name: TrimUICompanion-Windows
          path: dist/TrimUICompanion.exe
